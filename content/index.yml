about:
  title: "À propos"
  description: |
    Passionné de backend et de frontend, je construis des APIs en ASP.NET et des interfaces web modernes (Vue/Angular). Après un BUT Informatique, je suis maintenant en 1re année du cycle ingénieur Informatique et Réseaux à IMT Mines Alès, en alternance chez EFICAD, où j'alterne entre cours, projets d'équipe et missions en entreprise.
    J'aime relier la technique au besoin métier : clarifier le problème, prototyper vite, livrer avec des tests et documenter pour l'équipe.
