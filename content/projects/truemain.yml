slug: truemain
title: TrueMain
description: "Projet personnel autour de League of Legends : agréger et fiabiliser les statistiques de champions des meilleurs joueurs (top OTP, mains uniques) afin de proposer des recommandations de builds basées sur les vraies pratiques pro/high-elo plutôt que sur des moyennes globales. Développé en solo depuis février 2026, c'est l'occasion de monter une stack moderne complète : .NET 10, ASP.NET Core, un Worker Service pour ingérer en continu l'API Riot Games, PostgreSQL via Entity Framework Core, et un front Nuxt 4. Le tout conteneurisé avec Docker pour un déploiement simple."
image: /images/projects/truemain/architecture.svg
imageCaption: "Schéma d'architecture TrueMain : services externes (Riot API, DDragon CDN), bloc Docker Compose orchestrant le Worker .NET avec ses 7 processus, l'API ASP.NET Core en port 8080 (libs Core et Data partagées), PostgreSQL 17.2 et PgAdmin (dev/QA), et le frontend Nuxt 4 en port 3000 qui consomme l'API."
url: /projects/truemain
tags: ["League of Legends", ".NET 10", "ASP.NET Core", "Worker Service", "Nuxt 4", "PostgreSQL", "Docker"]
date: "2026-02-01"
