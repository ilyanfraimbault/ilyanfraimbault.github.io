highlights:
  - "En production sur truemain.lol : ≈ 430 000 parties de mains agrégées et 44 000 joueurs suivis, mis à jour en continu."
  - "Cinq briques déployées séparément : API ASP.NET Core, Worker d'ingestion, PostgreSQL, MongoDB et deux frontends Nuxt 4 (public + admin)."
  - "Pipeline d'ingestion de 20 processus ordonnés, du parcours des ladders Riot jusqu'à la rétention qui borne la taille de la base."
  - "Livraison continue : build Release avec analyseurs bloquants, tests d'intégration sur un vrai PostgreSQL, images publiées sur GHCR, preprod automatique et prod sur publication de release."
sections:
  - title: Pipeline d'ingestion (Worker .NET)
    items:
      - "BackgroundService .NET 10 qui enchaîne 20 processus dans un ordre imposé par leurs dépendances : parcours des ladders, découverte de joueurs, ingestion des parties classées et de leurs timelines, analyse des mains, puis les agrégations."
      - "Chaque processus est enregistré individuellement (démarrage, heartbeat, succès/échec, résumé sérialisé) : un échec est compté et journalisé, jamais fatal pour la boucle."
      - "Détection des « true mains » : un score qui croise le nombre de parties récentes sur le champion et le niveau de maîtrise, avec une politique de rétrogradation quand le joueur arrête de le jouer."
      - "Agrégations par patch et par palier de rang : builds, pages de runes, ordres de compétences, matchups (avec l'issue de voie à 15 minutes et les écarts d'or/XP), synergies, bans et pics de puissance."
      - "Étape de rétention finale qui purge les données brutes déjà agrégées, pour que la base reste bornée dans le temps."
  - title: API ASP.NET Core
    items:
      - "API REST qui expose les agrégats champion, le classement des mains, les profils joueurs et les endpoints /ops du portail d'administration, protégés par clé."
      - "Les lectures ne passent pas par un repository générique : chaque parcours a son query service dédié qui projette un read-model taillé pour la question posée."
      - "Filtres de portée validés strictement — un palier de rang inconnu renvoie une 400 plutôt que d'élargir silencieusement l'échantillon à toute la population."
      - "Cache mémoire borné, rate limiting global par IP, sondes /healthz et /readyz, erreurs au format RFC 7807 avec identifiant de trace."
  - title: Front public Nuxt 4
    items:
      - "Pages champion (builds, runes, ordre de compétences, arbre d'objets, pics de puissance, matchups, synergies duo et trio), tier list, annuaire champion × voie."
      - "Outil de matchup : le build est recalculé en direct sur les parties où les deux champions se sont réellement affrontés, avec l'issue de voie à 15 minutes et son verdict."
      - "Profils joueurs : courbe de LP sur 90 jours, grille d'activité à quatre granularités, score de dédication, historique de parties groupé par jour avec un score de performance par partie."
      - "Aucun appel direct du navigateur vers le backend ou les CDN Riot : tout transite par le proxy Nitro, ce qui mutualise le cache et garde l'API privée."
      - "SEO et partage : rendu serveur, sitemap, données structurées et cartes Open Graph générées dynamiquement pour les pages champion et joueur."
  - title: Portail d'administration
    items:
      - "Application Nuxt séparée (domaine et déploiement distincts) pour piloter le pipeline, derrière une session scellée ; la clé d'accès aux endpoints /ops n'atteint jamais le navigateur."
      - "Vue santé : un verdict global calculé côté serveur, puis les signaux triés par gravité (processus, qualité des données, retard d'ingestion, prévision de remplissage du disque)."
      - "Cinq détecteurs de qualité de données automatisés, une page de couverture par patch qui dit si le patch courant est réellement servable, et l'explorateur de comptes qui retrace un joueur dans tout le pipeline."
      - "Suivi de la consommation de l'API Riot par endpoint et par appelant, avec une estimation de la marge restante en nombre de comptes suivis."
  - title: Infrastructure
    items:
      - "Tout tourne en conteneurs Docker sur un seul hôte ; Caddy termine le TLS et reste le seul point d'entrée public, frontends et bases vivant sur un réseau interne."
      - "Trois stacks compose : dev avec hot-reload, preprod et prod construites à partir d'images publiées."
      - "Un environnement de préproduction complet, avec sa propre base et sa propre clé Riot, déployé automatiquement à chaque merge sur develop ; la prod ne bouge qu'à la publication d'une release."
      - "Les migrations de schéma ne s'appliquent plus au démarrage applicatif : un job CI les joue hors-ligne avant de faire tourner les images, ce qui évite qu'une migration lourde fasse boucler l'API au boot."
      - "Chaque déploiement pousse aussi un tag d'image immuable à côté du tag mobile, pour qu'un redéploiement ne relance jamais silencieusement l'image précédente."
  - title: Performance & rate limiting
    items:
      - "Quotas Riot Games anticipés côté client HTTP : limiteur de débit, respect du Retry-After, back-off, disjoncteur et timeouts par tentative — les 429 réessayés sont comptés comme des appels réels."
      - "Répartition du budget d'appels entre les régions par déficit de couverture plutôt que par quota fixe, avec report round-robin de la part non consommée."
      - "Tableau de bord des métriques d'ingestion : parties ingérées par période, appels et retries par endpoint, profondeur des files, latence des étapes du funnel."
      - "Estimation de marge : combien de comptes suivis supplémentaires le budget d'API absorbe, calculée sur les sept derniers jours."
      - "Prévision de remplissage du disque à partir de snapshots quotidiens des tailles PostgreSQL et MongoDB, avec la date de saturation projetée — ou une explication quand l'historique est trop court pour la calculer."
  - title: Profilage & optimisation
    items:
      - "Dimensions de build dédupliquées par contenu et pages de runes normalisées : un même build cliqué dans un autre ordre ne crée plus deux lignes et ne divise plus son échantillon."
      - "Agrégation par champion, morceau par morceau, pour borner la mémoire du Worker, et modèle EF Core compilé versionné dans le dépôt."
      - "Cache mémoire côté API avec taille bornée et clés de cache distinctes par portée, doublé d'un cache serveur sur les données statiques Riot."
      - "Icônes servies une seule fois en WebP 64 px via un helper unique, cache d'images borné en octets et purge indexée sur les patchs récents."
      - "Chargement différé et hydratation à la visibilité des panneaux lourds, pour supprimer les à-coups de scroll sur la page champion."
  - title: Qualité & CI
    items:
      - "Tests unitaires à chaque exécution et tests d'intégration sur un vrai PostgreSQL à chaque pull request, en plus du build des deux frontends."
      - "Build backend en Release avec les analyseurs de style traités comme des erreurs — le code ne passe pas la CI s'il dérive des conventions."
      - "Chaque pull request reçoit une revue de code automatisée avec verdict bloquant, en plus de la relecture manuelle."
      - "Documentation vivante versionnée avec le code : inventaire des fonctionnalités livrées, journal des décisions d'architecture avec l'incident ou la mesure qui les justifie, et RFC pour les évolutions majeures du modèle de données."
