slug: truemain
title: TrueMain
description: "Site d'analyse League of Legends en ligne sur truemain.lol, développé seul depuis février 2026. Il répond à une question par champion : que font vraiment les joueurs qui le maîtrisent ? Là où les sites de stats moyennent toutes les parties, TrueMain identifie les « true mains » (rapport parties jouées / maîtrise) et ne calcule builds, runes, matchups et synergies qu'à partir de leurs parties classées. Derrière : une solution .NET 10 (API ASP.NET Core + Worker d'ingestion Riot), PostgreSQL via EF Core, MongoDB pour les logs et métriques, et deux frontends Nuxt 4 — le site public et un portail d'administration — conteneurisés et déployés en continu sur un VPS."
image: /images/projects/truemain/truemain-accueil.webp
imageCaption: "Page d'accueil de truemain.lol : recherche de champion ou de joueur, et les deux compteurs live alimentés par l'API (parties de mains analysées, truemains suivis)."
gallery:
  - src: /images/projects/truemain/architecture.svg
    alt: Schéma d'architecture de TrueMain
    caption: "Architecture : la Riot API alimente le Worker d'ingestion (20 processus séquencés, de la découverte des joueurs à la rétention des données), qui écrit dans PostgreSQL et MongoDB ; l'API ASP.NET Core sert les lectures publiques et les endpoints /ops ; les deux frontends Nuxt (site public et portail admin) passent par leur proxy Nitro, derrière Caddy qui est le seul point d'entrée public. CI/CD GitHub Actions vers GHCR, preprod automatique sur develop et prod sur publication de release."
  - src: /images/projects/truemain/truemain-champion-build.webp
    alt: Page champion d'Ahri avec ses builds, runes, ordre de compétences et arbre d'objets
    caption: "Page champion (Ahri) : un onglet par build réellement joué, avec sorts d'invocateur, objets de départ, bottes, chemin d'objets, arbre de build et variations de runes — chaque ligne portant son taux de sélection et son taux de victoire. À droite, le même build résumé en toutes lettres (texte généré côté serveur, seul contenu de build présent dans le HTML rendu) et le classement des mains du champion."
  - src: /images/projects/truemain/truemain-champion-analyse.webp
    alt: Graphiques de tendance par patch, comparaison de deux patchs et panneau de matchups
    caption: "Analyse temporelle de la même page : évolution du win rate, du pick rate et du ban rate sur les cinq derniers patchs, diff entre deux patchs (build, runes, ordre de sorts) et panneau de matchups classé sur des bornes de Wilson, avec la distinction entre victoire de voie (à 15 min) et victoire de partie."
  - src: /images/projects/truemain/truemain-tierlist.webp
    alt: Tier list des champions classés de S à D
    caption: "Tier list calculée côté serveur : les champions sont notés sur un score pick / ban / win rate ajusté par la taille d'échantillon, puis rangés par percentile à l'intérieur de chaque voie. Un champion n'apparaît que sur ses deux voies dominantes, ce qui évite de le classer sur une voie qu'il ne joue pas."
  - src: /images/projects/truemain/truemain-champions.webp
    alt: Annuaire des champions avec filtres et build de consensus par ligne
    caption: "Annuaire champion × voie : une ligne par couple (champion, voie) avec sa rune clé, son build de consensus, son tier et ses taux. Le patch servi par défaut est le plus récent qui remplit réellement l'annuaire, jamais simplement le dernier patch ingéré."
  - src: /images/projects/truemain/truemain-matchup.webp
    alt: Outil de matchup avec deux champions face à face et le build recommandé
    caption: "Outil de matchup : on choisit son champion, son rôle et son adversaire direct, et le build est recalculé en direct à partir des parties où les deux se sont réellement affrontés. La bande de statistiques annonce l'échantillon utilisé, la similarité de draft, le win rate et l'issue de voie à 15 minutes avec ses écarts d'or et d'expérience."
  - src: /images/projects/truemain/truemain-profil-joueur.webp
    alt: Profil d'un joueur avec courbe de LP, grille d'activité et historique de parties
    caption: "Profil joueur : courbe de LP sur 90 jours colorée par palier, grille d'activité (partie / jour / semaine / patch), score de dédication détaillé, champions mains et historique de parties groupé par jour, chaque ligne portant son score de performance."
