slug: uniflow
title: Projet Entreprise - Uniflow
description: "Projet professionnel de data stewardship initié en stage chez EFICAD, puis poursuivi en alternance après validation en interne. L'application centralise la gouvernance des données clients entre EfiOPS (référentiel maître), Salesforce (CRM commercial) et Microsoft Dynamics 365 (CRM support/technique) afin de détecter automatiquement les incohérences, les prioriser et guider leur correction. Valeur pour l'entreprise : référentiels plus fiables, moins de ressaisie et une meilleure qualité de service."
image: /images/projects/eficad-uniflow/audit-comptes.png
imageCaption: "Page d'accueil : audit global des comptes EfiOPS avec les indicateurs clés (erreurs critiques, avertissements, comptes sains). Cette vue sert de point d'entrée pour piloter la qualité des données."
gallery:
  - src: /images/projects/eficad-uniflow/connexion-msal.png
    alt: Écran de connexion Uniflow avec authentification Microsoft (MSAL)
    caption: "Connexion : authentification déléguée à Microsoft (MSAL) pour aligner Uniflow sur l'identité Azure AD utilisée chez EFICAD."
  - src: /images/projects/eficad-uniflow/detection-erreur-cadware.png
    alt: Compte CADWARE avec erreurs critiques (identifiant invalide, identifiant manquant) et avertissement
    caption: "Détail d'un compte avec erreurs critiques : identifiant Dynamics invalide (pointe vers un autre compte EfiOPS) et identifiant Dynamics manquant. La sévérité \"critique\" pousse l'action en haut de la pile."
  - src: /images/projects/eficad-uniflow/vue-tri-panneaux.png
    alt: Vue tri-panneaux EfiOPS / Salesforce / Dynamics avec formulaires alignés et résultats de recherche
    caption: "Vue tri-panneaux de synchronisation : EfiOPS comme source à gauche, Salesforce et Dynamics à droite avec recherche intégrée et résultats. Les champs alignés (Nom, Raison sociale, Adresse, Téléphone, Pays…) facilitent la détection visuelle des divergences et la propagation des identifiants Flex ID, Salesforce ID et Dynamics ID."
