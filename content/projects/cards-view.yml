slug: cards-view
title: Composant Cartes (Cards View)
description: "Composant d'interface développé en alternance chez EFICAD pour le SWOOD Report Viewer : un mode de visualisation \"cartes\" alternatif aux tableaux classiques. Chaque enregistrement (panneau, débit…) devient une carte composée de cellules configurables — l'utilisateur réorganise la grille par drag & drop, redimensionne les cellules, choisit le mode d'affichage de chaque champ (valeur, QR Code, code-barres) et insère des images. Conçu comme brique générique Angular / PrimeNG réutilisable dans les applications internes."
image: /images/projects/cards-view/vue-card.png
imageCaption: "Rendu final dans SWOOD Report Viewer : la \"Nouvelle vue Card\" affiche chaque panneau (Cabinet_Back, Cabinet_Front…) sous forme de carte avec ses propriétés agencées dans la grille configurée par l'utilisateur."
gallery:
  - src: /images/projects/cards-view/edition-card-drag-n-drop.png
    alt: Éditeur de vue Card avec les cellules organisées dans la grille (drag & drop)
    caption: "Édition d'une vue Card : organisation des cellules dans la grille par drag & drop et resize, barre d'outils en haut à droite pour les paramètres globaux, prévisualisation en temps réel."
  - src: /images/projects/cards-view/personnalisation-cellule-card.png
    alt: Panneau de personnalisation d'une cellule avec libellé, taille et mode d'affichage
    caption: "Personnalisation d'une cellule : libellé personnalisé, taille (Petit / Moyen / Grand), affichage du libellé (Afficher / Masquer / En ligne) et mode d'affichage de la valeur (Valeur / QR Code / Code-barres)."
  - src: /images/projects/cards-view/table-vue-default.png
    alt: Vue tableau par défaut de SWOOD à contraster avec la vue Card
    caption: "Vue tableau par défaut de SWOOD Report Viewer (référence) : même donnée, format tabulaire dense. La vue Card cible les usages où le format visuel et le détail par enregistrement priment."
